[project]
name = "career-intelligence-backend"
version = "1.0.0"
description = "AI-powered Career Intelligence Platform - REST API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "orjson>=3.10.0",
    "python-magic>=0.4.27",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.5",
    "shap>=0.46.0",
    "mlflow>=2.15.0",
]
nlp = [
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "types-psycopg2>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "E402"]
ignore = ["B008", "BLE001", "C408", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/worker/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
